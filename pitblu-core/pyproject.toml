[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pitblu-core"
version = "0.9.0"
description = "Headless Weber iGrill hardware gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "pitblu-core contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiomqtt==2.5.1",
  "bleak==3.0.2",
  "fastapi==0.141.1",
  "PyYAML==6.0.3",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
pitblu-ble-proof = "pitblu_core.ble_spike:main"
pitblu-v202-check = "pitblu_core.physical_check:main"
pitblu-api = "pitblu_core.api:run"
pitblu-state = "pitblu_core.deployment:main"
pitblu-core-config = "pitblu_core.config_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pitblu_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--cov=pitblu_core --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
