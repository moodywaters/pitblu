name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pitblu-core
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pitblu-core/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools==83.0.0
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src tests
      - run: bash -n deploy/manage.sh
      - run: python -m pytest -vv -o faulthandler_timeout=30
      - name: Dependency inventory
        run: |
          python -m pip install hatchling==1.32.0
          python scripts/dependency_inventory.py > dependency-inventory.json
      - name: Known dependency vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local --skip-editable --format json --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-python-${{ matrix.python-version }}
          path: |
            pitblu-core/dependency-inventory.json
            pitblu-core/dependency-audit.json
